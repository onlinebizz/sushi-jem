<style>
:root{
  --bg:#FFFFFF;--bg2:#FBF6F2;--panel:#FFFFFF;--soft:#FDEDEA;--line:#EBD9D2;
  --acc:#C4162A;--on-acc:#FFFFFF;--text:#2A1B16;--muted:#7A655C;--shadow:rgba(196,22,42,.16);
  --ok:#1B7A3D;--leaf:24px 6px 24px 6px;--f-display:'Lalezar','IBM Plex Sans Arabic',sans-serif;--f-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--text);font-family:var(--f-body);font-size:.95rem;line-height:1.7}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.25}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#FDE3DE,transparent 66%)}
#login .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--leaf);padding:38px 34px;width:min(400px,100%);text-align:center;box-shadow:0 24px 70px var(--shadow)}
#login img{height:64px;margin:0 auto 6px}
#login h1{font-size:1.7rem;color:var(--acc)}
#login p{color:var(--muted);margin:2px 0 18px}
#login input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:.75em 1em;background:var(--bg);margin-bottom:6px}
#login input:focus{outline:none;border-color:var(--acc)}
.err{color:var(--acc);font-size:.85rem;min-height:1.4em;margin-bottom:4px}

/* shell */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;height:64px;padding:0 clamp(14px,3vw,28px)}
.topbar img{height:40px}
.topbar .t{font-family:var(--f-display);font-size:1.3rem;color:var(--acc)}
.topbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:.6em 1.3em;font-weight:600;background:var(--acc);color:var(--on-acc);text-decoration:none;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px var(--shadow)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--acc)}
.btn.sm{padding:.4em 1em;font-size:.85rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.dirty-dot{width:9px;height:9px;border-radius:50%;background:#E4A11B;display:inline-block}
.dirty-dot.saved{background:var(--ok)}
.shell{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 64px)}
.side{background:var(--panel);border-inline-end:1px solid var(--line);padding:14px 10px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:start;padding:.65em 1em;border-radius:12px;color:var(--text);font-weight:500;font-size:.97rem;margin-bottom:2px}
.side button.on{background:var(--acc);color:var(--on-acc)}
.main{padding:clamp(18px,3vw,36px);max-width:1040px}
.sec-title{font-size:1.9rem;color:var(--acc);margin-bottom:4px}
.sec-sub{color:var(--muted);margin:0 0 22px;max-width:46em}

/* cards & fields */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--leaf);padding:18px 20px;margin-bottom:14px}
.fld{display:grid;gap:5px;margin-bottom:12px}
.fld>label{font-weight:600;font-size:.88rem}
.fld .hint{color:var(--muted);font-size:.78rem}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:.55em .8em;background:var(--bg)}
.fld textarea{resize:vertical;min-height:60px}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.bi{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center}
.bi b{font-size:.78rem;color:var(--muted);font-weight:600}
.chk{display:inline-flex;gap:7px;align-items:center;font-weight:500;font-size:.9rem;white-space:nowrap;cursor:pointer}
.chk input{accent-color:var(--acc);width:17px;height:17px}
.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.side .i{width:19px;height:19px;stroke-width:1.6}
.iconbtn .i{width:16px;height:16px}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#D8CCC2}
.dot.on{background:var(--ok)}

/* menu tree */
.block{border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.block .sub{border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;background:var(--bg2)}
.block-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.block-head .grow{flex:1;min-width:130px}
.mini{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:.4em .6em;font-size:.88rem}
.iconbtn{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;padding:0;font-size:.9rem}
.iconbtn:hover{border-color:var(--acc);color:var(--acc)}
.iconbtn.danger:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.addbtn{border:1.5px dashed var(--acc);color:var(--acc);background:none;border-radius:12px;padding:.45em 1em;font-weight:600;font-size:.88rem;margin:6px 0}
.addbtn:hover{background:var(--soft)}
.varrow{display:grid;grid-template-columns:1fr 1fr 90px 32px;gap:8px;align-items:center;margin-bottom:6px}
.items-head{font-size:.8rem;color:var(--muted);font-weight:600;margin:10px 0 4px}

/* image picker */
.imgpick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:14px;padding:10px;background:var(--bg)}
.imgpick .prev{width:74px;height:74px;border-radius:12px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted);font-size:1.6rem}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.imgpick .ipt{flex:1;min-width:170px}
.imgpick .ipt input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:.45em .7em;background:var(--panel);font-size:.85rem}
.imgpick .up{flex:none}

/* chips (marquee / gallery) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 6px 4px 12px}
.chip input{border:0;background:none;min-width:90px;font-size:.9rem;outline:none}
.chip button{border:0;background:var(--soft);color:var(--acc);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;padding:0}

/* texts editor */
.tgroup{margin-bottom:18px}
.tgroup h3{font-size:1.25rem;color:var(--acc);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.trow{display:grid;grid-template-columns:230px 1fr 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.trow .k{font-size:.85rem;font-weight:600}
.trow input{border:1.5px solid var(--line);border-radius:10px;padding:.45em .7em;background:var(--bg);width:100%}

/* toast */
#toast{position:fixed;inset-inline:0;bottom:26px;z-index:100;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(10px);transition:.3s}
#toast.on{opacity:1;transform:none}
#toast span{background:var(--text);color:#fff;border-radius:999px;padding:.55em 1.4em;font-weight:600;box-shadow:0 12px 34px rgba(0,0,0,.25)}
#toast.err span{background:var(--acc)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;color:var(--acc)}
.stat span{color:var(--muted);font-size:.82rem}
.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.87rem;margin:10px 0}
.dangerzone{border-color:#E7B3B9}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;display:flex;overflow-x:auto;gap:6px;padding:10px}
  .side button{white-space:nowrap;width:auto}
  .row2,.row3{grid-template-columns:1fr}
  .trow{grid-template-columns:1fr;gap:4px}
  .varrow{grid-template-columns:1fr 1fr 70px 32px}
}
</style>
</head>

</div>

<div id="app" class="hidden">

    <main class="main" id="main"></main>
  </div>
</div>

function lbl(k){ return LBL[k] ? LBL[k][AUL === 'ar' ? 0 : 1] : k.replace(/^.*[.]/, '').replace(/[._]/g, ' ') }

/* ---------- helpers ---------- */
function getPath(o, path){ return path.split('.').reduce(function(x,k){return x==null?x:x[k]}, o) }
function setPath(o, path, v){
  var ks = path.split('.'), t = o;
  for (var i = 0; i < ks.length - 1; i++){
    if (t[ks[i]] == null) t[ks[i]] = {};
    t = t[ks[i]];
  }
  t[ks[ks.length-1]] = v;
}
function deepMerge(base, src){
  if (src === null || src === undefined) return base;
  if (typeof src !== 'object' || Array.isArray(src)) return src;
  var out = (typeof base === 'object' && base !== null && !Array.isArray(base)) ? base : {};
  Object.keys(src).forEach(function(k){ out[k] = (typeof src[k] === 'object' && src[k] !== null && !Array.isArray(src[k]) && typeof out[k] === 'object' && out[k] !== null) ? deepMerge(out[k], src[k]) : src[k] });
  return out;
}
function clone(o){ return JSON.parse(JSON.stringify(o)) }
function toast(msg, isErr){
  var el = $('#toast');
  el.querySelector('span').textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('on');
  clearTimeout(el._h);
  el._h = setTimeout(function(){ el.classList.remove('on') }, 2400);
}
function markDirty(){
  dirty = true;
  $('#saveBtn').disabled = false;
  $('#dirtyDot').classList.remove('saved');
}
function clearDirty(){
  dirty = false;
  $('#saveBtn').disabled = true;
  $('#dirtyDot').classList.add('saved');
}
function fmtDate(ms){
  if (!ms) return t('never');
  try { return new Date(ms).toLocaleString(AUL === 'ar' ? 'ar-SA' : 'en-GB') } catch(e){ return String(ms) }
}
function imgPreviewSrc(v){
  if (!v) return '';
  if (/^(https?:|\/|data:)/.test(v)) return v;
  return 'images/' + v + '.jpg';
}

/* ---------- field builders ---------- */
function fld(label, path, val, hint, type){
  var h = '<div class="fld"><label>' + esc(label) + '</label>';
  if (type === 'textarea') h += '<textarea data-path="' + path + '">' + esc(val) + '</textarea>';
  else if (type === 'num') h += '<input data-path="' + path + '" type="number" step="any" value="' + esc(val) + '">';
  else if (type === 'password') h += '<input data-path="' + path + '" type="password" autocomplete="new-password" value="">';
  else h += '<input data-path="' + path + '" value="' + esc(val) + '">';
  if (hint) h += '<span class="hint">' + esc(hint) + '</span>';
  return h + '</div>';
}
function bi(label, basePath, pair, hint){
  pair = pair || ['', ''];
  var h = '<div class="fld"><label>' + esc(label) + '</label><div class="bi"><b>ع</b><input data-path="' + basePath + '.0" value="' + esc(pair[0]) + '"><b>EN</b><input data-path="' + basePath + '.1" value="' + esc(pair[1]) + '"></div>';
  if (hint) h += '<span class="hint">' + esc(hint) + '</span>';
  return h + '</div>';
}
function chk(label, path, val){
  return '<label class="chk"><input type="checkbox" data-cast="bool" data-path="' + path + '"' + (val ? ' checked' : '') + '>' + esc(label) + '</label>';
}
function imgPick(label, path, val, hint){
  var pv = imgPreviewSrc(val);
  return '<div class="fld"><label>' + esc(label) + '</label>' +
  '<div class="imgpick">' +
  '<div class="prev">' + (pv ? '<img src="' + esc(pv) + '" alt="" referrerpolicy="no-referrer">' : '<svg class="i"><use href="#i-img"/></svg>') + '</div>' +
  '<div class="ipt"><input data-path="' + path + '" value="' + esc(val || '') + '" placeholder="' + esc(t('imgHint')) + '"></div>' +
  '<label class="btn sm up">' + esc(t('uploadBtn')) + '<input type="file" accept="image/*" class="hidden" data-upload></label>' +
  '</div>' +
  (hint ? '<span class="hint">' + esc(hint) + '</span>' : '') +
  '</div>';
}

/* ---------- structural actions ---------- */
function arrOp(arr, i, dir){
  var j = i + dir;
  if (j < 0 || j >= arr.length) return;
  var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
}
function getActList(el){
  var lp = el.dataset.list;
  if (lp === 'config.marquee') return C.config.marquee;
  if (lp === 'config.rail') return C.config.rail;
  return null;
}
function act(a, el){
  var i = +el.dataset.i, ci = el.dataset.ci != null ? +el.dataset.ci : null, gi = el.dataset.gi != null ? +el.dataset.gi : null, ii = el.dataset.ii != null ? +el.dataset.ii : null;
  switch (a){
    case 'cat-add': C.menu.push({id:'c' + Date.now().toString(36), t:['قسم جديد','New section'], groups:[{t:['',''], items:[]}]}); break;
    case 'cat-del': if (C.menu.length < 2 || confirm(t('confirmDel'))) C.menu.splice(i, 1); break;
    case 'cat-up': arrOp(C.menu, i, -1); break;
    case 'cat-down': arrOp(C.menu, i, 1); break;
    case 'grp-add': C.menu[ci].groups.push({t:['',''], items:[]}); break;
    case 'grp-del': if (confirm(t('confirmDel'))) C.menu[ci].groups.splice(i, 1); break;
    case 'grp-up': arrOp(C.menu[ci].groups, i, -1); break;
    case 'grp-down': arrOp(C.menu[ci].groups, i, 1); break;
    case 'item-add': C.menu[ci].groups[gi].items.push({id:'i' + Date.now().toString(36), n:['صنف جديد','New item'], d:['',''], v:[['','', 0]]}); break;
    case 'item-del': if (confirm(t('confirmDel'))) C.menu[ci].groups[gi].items.splice(i, 1); break;
    case 'item-up': arrOp(C.menu[ci].groups[gi].items, i, -1); break;
    case 'item-down': arrOp(C.menu[ci].groups[gi].items, i, 1); break;
    case 'var-add': C.menu[ci].groups[gi].items[ii].v.push(['','', 0]); break;
    case 'var-del': C.menu[ci].groups[gi].items[ii].v.splice(i, 1); break;
    case 'off-add': C.offers.push({enabled:true, t:['عرض جديد','New offer'], d:['',''], badge:['',''], price:'', oldPrice:'', img:'', link:''}); break;
    case 'off-del': if (confirm(t('confirmDel'))) C.offers.splice(i, 1); break;
    case 'off-up': arrOp(C.offers, i, -1); break;
    case 'off-down': arrOp(C.offers, i, 1); break;
    case 'br-add': C.config.branches.push({id:'b' + Date.now().toString(36), n:['فرع جديد','New branch'], a:['','']}); break;
    case 'br-del': if (confirm(t('confirmDel'))) C.config.branches.splice(i, 1); break;
    case 'chip-add': getActList(el).push(''); break;
    case 'chip-del': getActList(el).splice(i, 1); break;
    case 'reset':
      if (confirm(t('confirmReset'))){
        C = clone(DEFAULTS);
        if (C._comment) delete C._comment;
        toast(t('resetDone'));
      }
      break;
    case 'logout':
      fetch('api/logout', {method:'POST'}).then(function(){ location.reload() });
      break;
    case 'pw-change':
      (function(){
        var cur = $('#main [data-path="pwCur"]').value, nw = $('#main [data-path="pwNew"]').value, nw2 = $('#main [data-path="pwNew2"]').value;
        var e2 = $('#pwErr');
        if (nw !== nw2){ e2.textContent = AUL === 'ar' ? 'التأكيد لا يطابق' : 'Confirmation does not match'; return; }
        fetch('api/password', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({current:cur, next:nw})})
          .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j} }) })
          .then(function(res){
            if (res.ok){ toast(t('pwChanged')); setTimeout(function(){ location.reload() }, 1200); }
            else e2.textContent = res.j.error || t('pwWrong');
          });
      })();
      break;
    default: return;
  }
  if (a !== 'export' && a !== 'logout' && a !== 'pw-change'){ markDirty(); renderMain(); }
}

/* ---------- image upload ---------- */
function compressImage(file, cb){
  if (file.type === 'image/svg+xml' || file.type === 'image/gif'){
    var rd = new FileReader();
    rd.onload = function(){ cb(rd.result) };
    rd.readAsDataURL(file);
    return;
  }
  var img = new Image();
  var ur = URL.createObjectURL(file);
  img.onload = function(){
    var MAX = 1600;
    var scale = Math.min(1, MAX / Math.max(img.width, img.height));
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.width * scale));
    cv.height = Math.max(1, Math.round(img.height * scale));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL('image/jpeg', 0.82));
    URL.revokeObjectURL(ur);
  };
  img.onerror = function(){ toast(t('uploadFail'), true) };
  img.src = ur;
}
function uploadImage(file, onDone){
  if (!file || !/^image\//.test(file.type)){ toast(t('uploadFail'), true); return; }
  if (file.size > 25_000_000){ toast(t('uploadBig'), true); return; }
  toast(t('uploading'));
  compressImage(file, function(dataUrl){
    if (dataUrl.length > 4_400_000){ toast(t('uploadBig'), true); return; }
    fetch('api/media', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({data:dataUrl})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j} }) })
      .then(function(res){
        if (res.ok){ toast(t('uploadDone')); onDone(res.j.url) }
        else toast(res.j.error || t('uploadFail'), true);
      })
      .catch(function(){ toast(t('uploadFail'), true) });
  });
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var s = e.target.closest('[data-sec]');
  if (s){ curSec = s.dataset.sec; renderSide(); renderMain(); return; }
  var a = e.target.closest('[data-act]');
  if (a){ act(a.dataset.act, a); return; }
});
document.addEventListener('input', function(e){
  var p = e.target.dataset ? e.target.dataset.path : null;
  if (!p || p.indexOf('pw') === 0) return;
  var v = e.target.value;
  if (e.target.type === 'number') v = (v === '' ? '' : Number(v));
  setPath(C, p, v);
  markDirty();
});
document.addEventListener('input', function(e){
  var lp = e.target.dataset ? e.target.dataset.list : null;
  if (!lp) return;
  var list = lp === 'config.marquee' ? C.config.marquee : C.config.rail;
  list[+e.target.dataset.i] = e.target.value;
  markDirty();
});
document.addEventListener('change', function(e){
  if (e.target.dataset && e.target.dataset.cast === 'bool' && e.target.dataset.path){
    setPath(C, e.target.dataset.path, e.target.checked);
    markDirty();
  }
  if (e.target.dataset && e.target.dataset.upload != null && e.target.files && e.target.files[0]){
    var input = e.target;
    var lp = input.dataset.list;
    uploadImage(input.files[0], function(url){
      if (lp){
        var list = lp === 'config.marquee' ? C.config.marquee : C.config.rail;
        if (input.dataset.chipIndex != null){ list[+input.dataset.chipIndex] = url }
        else { list.push(url) }
        markDirty(); renderMain();
      } else {
        var holder = input.closest('.imgpick');
        if (holder){
          var ipt = holder.querySelector('[data-path]');
          ipt.value = url;
          ipt.dispatchEvent(new Event('input', {bubbles:true}));
          var pv = holder.querySelector('.prev');
          pv.innerHTML = '<img src="' + esc(url) + '" alt="" referrerpolicy="no-referrer">';
        }
      }
    });
    input.value = '';
  }
});
document.addEventListener('keydown', function(e){
  if ((e.metaKey || e.ctrlKey) && e.key === 's'){ e.preventDefault(); if (dirty) save(); }
});
window.addEventListener('beforeunload', function(e){
  if (dirty){ e.preventDefault(); e.returnValue = t('unsaved'); return e.returnValue }
});

/* ---------- save ---------- */
function save(){
  $('#saveBtn').textContent = t('saving');
  fetch('api/content', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(C)
  }).then(function(r){
    return r.json().then(function(j){ return {ok: r.ok, j: j} });
  }).then(function(res){
    if (res.ok){
      updated_at = res.j.updated_at;
      clearDirty();
      toast(t('saved'));
    } else if (res.j && res.j.error === 'auth'){
      toast(t('sessionEnded'), true);
      showLogin();
    } else {
      toast(res.j.error || 'error', true);
    }
  }).catch(function(){ toast('network error', true) })
  .finally(function(){ $('#saveBtn').textContent = t('save') });
}
$('#saveBtn').addEventListener('click', save);

$('#langBtn').addEventListener('click', function(){
  AUL = AUL === 'ar' ? 'en' : 'ar';
  document.documentElement.lang = AUL;
  document.documentElement.dir = AUL === 'ar' ? 'rtl' : 'ltr';
  $('#langBtn').textContent = AUL === 'ar' ? 'EN' : 'عربي';
  applyChrome();
  if ($('#app').classList.contains('hidden')) return;
  renderSide(); renderMain();
});

function applyChrome(){
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.dataset.t) });
}

/* ---------- login & boot ---------- */
function showLogin(){
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#loginPw').value = '';
  $('#loginPw').focus();
}
function showApp(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  applyChrome();
  renderSide(); renderMain();
  clearDirty();
}
function loadContent(){
  return fetch('api/content').then(function(r){ return r.json() }).then(function(cc){
    updated_at = cc.updated_at;
    C = cc.content ? deepMerge(clone(DEFAULTS), cc.content) : clone(DEFAULTS);
    if (C._comment) delete C._comment;
    showApp();
  });
}
$('#loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var err = $('#loginErr');
  err.textContent = '';
  fetch('api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:$('#loginPw').value})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j} }) })
    .then(function(res){
      if (res.ok) loadContent();
      else if (res.j.retry_after) err.textContent = t('locked') + Math.ceil(res.j.retry_after/1000) + t('sec');
      else err.textContent = t('loginFail');
    })
    .catch(function(){ err.textContent = 'network error' });
});

applyChrome();
fetch('content.json').then(function(r){ return r.json() }).then(function(d){
  DEFAULTS = d;
  fetch('api/session').then(function(r){
    if (r.ok) loadContent();
    else showLogin();
  }).catch(showLogin);
}).catch(function(){
  $('#login').classList.remove('hidden');
  $('#loginErr').textContent = 'failed to load defaults';
});
</script>
