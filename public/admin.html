<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#C4162A">
<title>لوحة تحكم سوشي جيم</title>
<link rel="icon" href="images/logo-pagoda.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--bg2:#FBF6F2;--panel:#FFFFFF;--soft:#FDEDEA;--line:#EBD9D2;
  --acc:#C4162A;--on-acc:#FFFFFF;--text:#2A1B16;--muted:#7A655C;--shadow:rgba(196,22,42,.16);
  --ok:#1B7A3D;--leaf:24px 6px 24px 6px;--f-display:'Lalezar','IBM Plex Sans Arabic',sans-serif;--f-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--text);font-family:var(--f-body);font-size:1rem;line-height:1.7}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.25}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}

/* English fields hidden unless enabled */
.enwrap{display:none}
body.show-en .enwrap{display:contents}
body.show-en .bi{grid-template-columns:1fr 1fr}
body.show-en .trow{grid-template-columns:230px 1fr 1fr}

/* settings groups (collapsible) */
details.sgroup{margin-bottom:12px;border:1px solid var(--line);border-radius:var(--leaf);background:var(--panel);overflow:hidden}
details.sgroup summary{cursor:pointer;padding:15px 18px;font-family:var(--f-display);font-size:1.2rem;color:var(--acc);display:flex;align-items:center;gap:10px;list-style:none;min-height:52px}
details.sgroup summary::-webkit-details-marker{display:none}
details.sgroup summary .i{width:18px;height:18px;transition:transform .2s}
details[open].sgroup summary .i{transform:rotate(90deg)}
details.sgroup .sbody{padding:2px 18px 16px}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,#FDE3DE,transparent 66%)}
#login .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--leaf);padding:38px 34px;width:min(400px,100%);text-align:center;box-shadow:0 24px 70px var(--shadow)}
#login img{height:64px;margin:0 auto 6px}
#login h1{font-size:1.7rem;color:var(--acc)}
#login p{color:var(--muted);margin:2px 0 18px}
#login input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:.75em 1em;background:var(--bg);margin-bottom:6px}
#login input:focus{outline:none;border-color:var(--acc)}
.err{color:var(--acc);font-size:.9rem;min-height:1.4em;margin-bottom:4px}

/* shell */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;height:64px;padding:0 clamp(14px,3vw,28px)}
.topbar img{height:40px}
.topbar .t{font-family:var(--f-display);font-size:1.3rem;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:.6em 1.3em;font-weight:600;background:var(--acc);color:var(--on-acc);text-decoration:none;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px var(--shadow)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost.en-on{box-shadow:inset 0 0 0 1.5px var(--acc);color:var(--acc)}
.btn.sm{padding:.4em 1em;font-size:.88rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.dirty-dot{width:9px;height:9px;border-radius:50%;background:#E4A11B;display:inline-block}
.dirty-dot.saved{background:var(--ok)}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 64px)}
.shell>*{min-width:0}
.side{background:var(--panel);border-inline-end:1px solid var(--line);padding:14px 10px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.side button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:start;padding:.7em 1em;border-radius:12px;color:var(--text);font-weight:500;font-size:1rem;margin-bottom:2px}
.side button.on{background:var(--acc);color:var(--on-acc)}
.main{padding:clamp(18px,3vw,36px);max-width:1000px}
.sec-title{font-size:2rem;color:var(--acc);margin-bottom:14px}
.sec-sub{color:var(--muted);margin:0 0 22px;max-width:46em}

/* dashboard tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--leaf);padding:26px 18px;text-align:center;font-family:var(--f-display);font-size:1.35rem;color:var(--text);transition:transform .15s,border-color .15s}
.tile .i{width:34px;height:34px;color:var(--acc);margin:0 auto 8px;display:block}
.tile:hover{transform:translateY(-3px);border-color:var(--acc);color:var(--acc)}

/* cards & fields */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--leaf);padding:18px 20px;margin-bottom:14px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld>label{font-weight:600;font-size:.92rem}
.fld .hint{color:var(--muted);font-size:.82rem}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:.6em .85em;background:var(--bg);font-size:1rem}
.fld textarea{resize:vertical;min-height:60px}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bi{display:grid;grid-template-columns:1fr;gap:8px;align-items:center}
.bi b{font-size:.8rem;color:var(--muted);font-weight:600}
.chk{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:1rem;white-space:nowrap;cursor:pointer;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:.45em 1.1em}
.chk input{accent-color:var(--acc);width:18px;height:18px}

/* menu: category chips + compact item rows */
.catchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;scrollbar-width:thin}
.catchip{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:.5em 1.2em;font-weight:600;font-size:.95rem;white-space:nowrap}
.catchip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.catchip.add{border-style:dashed;color:var(--acc);background:none}
.itemrow{display:grid;grid-template-columns:52px minmax(0,1fr) 90px 40px;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--bg);margin:8px 0}
.itemrow .thumb{width:52px;height:52px;border-radius:12px;background:var(--soft);border:1.5px solid var(--line);display:grid;place-items:center;padding:0;overflow:hidden;color:var(--muted)}
.itemrow .thumb img{width:100%;height:100%;object-fit:cover}
.itemrow .nm{min-width:0;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:.5em .7em;background:var(--panel)}
.itemrow .pr{min-width:0;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:.5em .3em;background:var(--panel);text-align:center;direction:ltr}
body.show-en .itemrow .enwrap{display:contents}
body.show-en .itemrow .enwrap input{grid-column:2 / -1;grid-row:2;min-width:0}
.itemmore{display:none;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;background:var(--bg2)}
.itemmore.open{display:block}

/* menu tree */
.block{border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.block .sub{border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;background:var(--bg2)}
.block-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.block-head .grow{flex:1;min-width:130px}
.mini{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:.45em .65em;font-size:.95rem}
.iconbtn{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;padding:0;flex:none}
.iconbtn:hover{border-color:var(--acc);color:var(--acc)}
.iconbtn.danger:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.addbtn{border:1.5px dashed var(--acc);color:var(--acc);background:none;border-radius:12px;padding:.5em 1.1em;font-weight:600;font-size:.95rem;margin:6px 0}
.addbtn:hover{background:var(--soft)}
.bigadd{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;background:var(--acc);color:#fff;border-radius:14px;padding:.85em 1em;font-weight:700;font-size:1.05rem;margin:14px 0 4px;box-shadow:0 10px 26px var(--shadow)}
.bigadd:hover{filter:brightness(1.06)}
.bigadd .i{width:20px;height:20px}
.morebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.morebar .grow{flex:1}
.txtbtn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:.4em 1.1em;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.txtbtn:hover{border-color:var(--acc);color:var(--acc)}
.txtbtn.danger{color:var(--acc)}
.txtbtn.danger:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.varrow{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:center;margin-bottom:6px}
body.show-en .varrow{grid-template-columns:1fr 1fr 90px 40px}
body.show-en .varrow .enwrap{display:contents}

/* image picker */
.imgpick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);border-radius:14px;padding:10px;background:var(--bg)}
.imgpick .prev{width:74px;height:74px;border-radius:12px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted)}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.imgpick .ipt{flex:1;min-width:150px}
.imgpick .ipt input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:.5em .7em;background:var(--panel);font-size:.9rem}
.imgpick .up{flex:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 6px 4px 12px}
.chip input{border:0;background:none;min-width:90px;font-size:.95rem;outline:none}
.chip button{border:0;background:var(--soft);color:var(--acc);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;padding:0}

/* texts editor */
.tsearch{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:.65em 1.2em;background:var(--bg);font-size:1rem;margin-bottom:16px}
.tsearch:focus{outline:none;border-color:var(--acc)}
details.tgroup{margin-bottom:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
details.tgroup summary{cursor:pointer;padding:13px 18px;font-family:var(--f-display);font-size:1.25rem;color:var(--acc);list-style:none;display:flex;align-items:center;gap:10px}
details.tgroup summary::-webkit-details-marker{display:none}
details.tgroup summary .i{width:18px;height:18px;transition:transform .2s}
details[open].tgroup summary .i{transform:rotate(90deg)}
details.tgroup .tbody{padding:0 18px 12px}
.trow{display:grid;grid-template-columns:230px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.trow .k{font-size:.9rem;font-weight:600}
.trow input{border:1.5px solid var(--line);border-radius:10px;padding:.5em .7em;background:var(--bg);width:100%}

/* toast */
#toast{position:fixed;inset-inline:0;bottom:26px;z-index:100;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(10px);transition:.3s}
#toast.on{opacity:1;transform:none}
#toast span{background:var(--text);color:#fff;border-radius:999px;padding:.6em 1.5em;font-weight:600;box-shadow:0 12px 34px rgba(0,0,0,.25)}
#toast.err span{background:var(--acc)}

.note{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:.9rem;margin:10px 0}
.dangerzone{border-color:#E7B3B9}
.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.side .i{width:19px;height:19px;stroke-width:1.6}
.iconbtn .i{width:16px;height:16px}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#D8CCC2}
.dot.on{background:var(--ok)}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:64px;z-index:40;height:auto;display:flex;overflow-x:auto;gap:6px;padding:10px;border-inline-end:0;border-bottom:1px solid var(--line);background:var(--bg2);-webkit-overflow-scrolling:touch}
  .side button{white-space:nowrap;width:auto;flex:none;padding:.65em 1.1em;margin:0}
  .row2{grid-template-columns:1fr}
  .trow{grid-template-columns:1fr;gap:4px}
  body.show-en .trow{grid-template-columns:1fr}
  body.show-en .enwrap{display:block}
  body.show-en .bi{grid-template-columns:1fr}
  body.show-en .varrow .enwrap input{grid-column:1;grid-row:2}
}
@media (max-width:640px){
  .topbar .t{display:none}
  .topbar{gap:8px}
  .sec-title{font-size:1.55rem}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .itemrow{grid-template-columns:48px minmax(0,1fr) 78px 44px}
  .varrow,body.show-en .varrow{grid-template-columns:1fr 78px 44px}
  .iconbtn{width:44px;height:44px}
  .catchip{padding:.6em 1.2em}
  .main{padding:16px 14px}
  .card{padding:16px 14px}
  details.sgroup .sbody{padding:2px 14px 14px}
  details.tgroup .tbody{padding:0 14px 12px}
  #toast{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){
  .topbar a[href="/"]{display:none}
}
</style>
</head>

</svg>

<div id="login" class="hidden">
  <div class="card">
    <img src="images/logo-pagoda-transparent.png" alt="سوشي جيم">
    <h1 data-t="loginTitle">لوحة تحكم سوشي جيم</h1>
    <p data-t="loginSub">اكتب كلمة المرور للدخول</p>
    <form id="loginForm">
      <input type="password" id="loginPw" autocomplete="current-password" placeholder="كلمة المرور" aria-label="كلمة المرور">
      <div class="err" id="loginErr"></div>
      <button class="btn" type="submit" style="width:100%" data-t="loginBtn">دخول</button>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <img src="images/logo-pagoda-transparent.png" alt="">
    <span class="t" data-t="appTitle">لوحة تحكم سوشي جيم</span>
    <span class="sp"></span>
    <span class="dirty-dot" id="dirtyDot"></span>
    <button class="btn ghost sm" id="enBtn" type="button" title="إظهار / إخفاء الحقول الإنجليزية">EN</button>
    <a class="btn ghost sm" href="/" target="_blank" rel="noopener" data-t="viewSite">الموقع</a>
    <button class="btn" id="saveBtn" type="button" disabled data-t="save">حفظ ونشر</button>
  </div>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>
</div>

<div id="toast" role="status"><span></span></div>

/* ---------- helpers ---------- */
function getPath(o, path){ return path.split('.').reduce(function(x,k){return x==null?x:x[k]}, o) }
function setPath(o, path, v){
  var ks = path.split('.'), t = o;
  for (var i = 0; i < ks.length - 1; i++){
    if (t[ks[i]] == null) t[ks[i]] = {};
    t = t[ks[i]];
  }
  t[ks[ks.length-1]] = v;
}
function deepMerge(base, src){
  if (src === null || src === undefined) return base;
  if (typeof src !== 'object' || Array.isArray(src)) return src;
  var out = (typeof base === 'object' && base !== null && !Array.isArray(base)) ? base : {};
  Object.keys(src).forEach(function(k){ out[k] = (typeof src[k] === 'object' && src[k] !== null && !Array.isArray(src[k]) && typeof out[k] === 'object' && out[k] !== null) ? deepMerge(out[k], src[k]) : src[k] });
  return out;
}

function toast(msg, isErr){
  var el = $('#toast');

  el.classList.toggle('err', !!isErr);

/* ---------- field builders ---------- */
function fld(label, path, val, hint, type){
  var h = '<div class="fld"><label>' + esc(label) + '</label>';
  if (type === 'num') h += '<input data-path="' + path + '" type="number" step="any" inputmode="decimal" value="' + esc(val) + '">';
  else if (type === 'password') h += '<input data-path="' + path + '" type="password" autocomplete="new-password" value="">';
  else if (type === 'ltr') h += '<input data-path="' + path + '" dir="ltr" value="' + esc(val) + '">';
  else h += '<input data-path="' + path + '" value="' + esc(val) + '">';
  if (hint) h += '<span class="hint">' + (/^https?:/.test(hint) ? '<bdi>' + esc(hint) + '</bdi>' : esc(hint)) + '</span>';
  return h + '</div>';
}

/* ---------- structural actions ---------- */
function arrOp(arr, i, dir){
  var j = i + dir;
  if (j < 0 || j >= arr.length) return;
  var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
}
function getActList(el){
  var lp = el.dataset.list;
  if (lp === 'config.marquee') return C.config.marquee;
  if (lp === 'config.rail') return C.config.rail;
  return null;
}
function act(a, el){
  var i = +el.dataset.i, ci = el.dataset.ci != null ? +el.dataset.ci : null, gi = el.dataset.gi != null ? +el.dataset.gi : null, ii = el.dataset.ii != null ? +el.dataset.ii : null;
  switch (a){
    case 'cat-add': C.menu.push({id:'c' + Date.now().toString(36), t:['قسم جديد','New section'], groups:[{t:['',''], items:[]}]}); curCat = C.menu.length - 1; break;
    case 'cat-del': if (C.menu.length < 2 || confirm(t('confirmDel'))) C.menu.splice(i, 1); break;
    case 'cat-up': arrOp(C.menu, i, -1); break;
    case 'cat-down': arrOp(C.menu, i, 1); break;
    case 'grp-add': C.menu[ci].groups.push({t:['',''], items:[]}); break;
    case 'grp-del': if (confirm(t('confirmDel'))) C.menu[ci].groups.splice(i, 1); break;
    case 'grp-up': arrOp(C.menu[ci].groups, i, -1); break;
    case 'grp-down': arrOp(C.menu[ci].groups, i, 1); break;
    case 'item-add': C.menu[ci].groups[gi].items.push({id:'i' + Date.now().toString(36), n:['صنف جديد','New item'], d:['',''], v:[['','', 0]]}); break;
    case 'item-del': if (confirm(t('confirmDel'))) C.menu[ci].groups[gi].items.splice(i, 1); break;
    case 'item-up': arrOp(C.menu[ci].groups[gi].items, i, -1); break;
    case 'item-down': arrOp(C.menu[ci].groups[gi].items, i, 1); break;
    case 'var-add': C.menu[ci].groups[gi].items[ii].v.push(['','', 0]); break;
    case 'var-del': C.menu[ci].groups[gi].items[ii].v.splice(i, 1); break;
    case 'off-add': C.offers.push({enabled:true, t:['عرض جديد','New offer'], d:['',''], badge:['',''], price:'', oldPrice:'', img:'', link:''}); break;
    case 'off-del': if (confirm(t('confirmDel'))) C.offers.splice(i, 1); break;
    case 'off-up': arrOp(C.offers, i, -1); break;
    case 'off-down': arrOp(C.offers, i, 1); break;
    case 'br-add': C.config.branches.push({id:'b' + Date.now().toString(36), n:['فرع جديد','New branch'], a:['','']}); break;
    case 'br-del': if (confirm(t('confirmDel'))) C.config.branches.splice(i, 1); break;
    case 'chip-add': getActList(el).push(''); break;
    case 'chip-del': getActList(el).splice(i, 1); break;
    case 'reset':
      if (confirm(t('confirmReset'))){
        C = clone(DEFAULTS);
        if (C._comment) delete C._comment;
        toast(t('resetDone'));
      }
      break;
    case 'logout':
      fetch('api/logout', {method:'POST'}).then(function(){ location.reload() });
      break;
    case 'pw-change':
      (function(){
        var cur = $('#main [data-path="pwCur"]').value, nw = $('#main [data-path="pwNew"]').value, nw2 = $('#main [data-path="pwNew2"]').value;
        var e2 = $('#pwErr');
        if (nw !== nw2){ e2.textContent = 'التأكيد لا يطابق'; return; }
        fetch('api/password', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({current:cur, next:nw})})
          .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j} }) })
          .then(function(res){
            if (res.ok){ toast(t('pwChanged')); setTimeout(function(){ location.reload() }, 1200); }
            else e2.textContent = res.j.error || t('pwWrong');
          });
      })();
      break;
    default: return;
  }
  if (a !== 'logout' && a !== 'pw-change'){ markDirty(); renderMain(); }
}

/* ---------- image upload ---------- */
function compressImage(file, cb){
  if (file.type === 'image/svg+xml' || file.type === 'image/gif'){
    var rd = new FileReader();
    rd.onload = function(){ cb(rd.result) };
    rd.readAsDataURL(file);
    return;
  }
  var img = new Image();
  var ur = URL.createObjectURL(file);
  img.onload = function(){
    var MAX = 1600;
    var scale = Math.min(1, MAX / Math.max(img.width, img.height));
    var cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.width * scale));
    cv.height = Math.max(1, Math.round(img.height * scale));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL('image/jpeg', 0.82));
    URL.revokeObjectURL(ur);
  };
  img.onerror = function(){ toast(t('uploadFail'), true) };
  img.src = ur;
}
function uploadImage(file, onDone){
  if (!file || !/^image\//.test(file.type)){ toast(t('uploadFail'), true); return; }
  if (file.size > 25_000_000){ toast(t('uploadBig'), true); return; }
  toast(t('uploading'));
  compressImage(file, function(dataUrl){
    if (dataUrl.length > 4_400_000){ toast(t('uploadBig'), true); return; }
    fetch('api/media', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({data:dataUrl})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j} }) })
      .then(function(res){
        if (res.ok){ toast(t('uploadDone')); onDone(res.j.url) }
        else toast(res.j.error || t('uploadFail'), true);
      })
      .catch(function(){ toast(t('uploadFail'), true) });
  });
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var s = e.target.closest('[data-sec]');
  if (s){ curSec = s.dataset.sec; renderSide(); renderMain(); return; }
  var cc = e.target.closest('[data-catchip]');
  if (cc){ curCat = +cc.dataset.catchip; renderMain(); return; }
  var more = e.target.closest('[data-act="more"]');
  if (more){ var panel = document.getElementById(more.dataset.more); if (panel) panel.classList.toggle('open'); return; }
  var a = e.target.closest('[data-act]');
  if (a){ act(a.dataset.act, a); return; }
  var sum = e.target.closest('summary');
  if (sum) return; // let details toggle naturally
});
document.addEventListener('input', function(e){
  if (e.target.dataset && e.target.dataset.spath){
    var sp = e.target.dataset.spath.split('|');
    if (C && C.strings && C.strings[sp[0]]){ C.strings[sp[0]][sp[1]] = e.target.value; markDirty(); }
    return;
  }
  var p = e.target.dataset ? e.target.dataset.path : null;
  if (e.target.id === 'tsearch'){
    var q = e.target.value.trim();
    document.querySelectorAll('details.tgroup').forEach(function(d){ d.open = !!q });
    document.querySelectorAll('.trow').forEach(function(r){
      r.style.display = (!q || (r.dataset.search || '').indexOf(q) > -1) ? '' : 'none';
    });
    return;
  }
  if (!p || p.indexOf('pw') === 0) return;
  var v = e.target.value;
  if (e.target.type === 'number') v = (v === '' ? '' : Number(v));
  setPath(C, p, v);
  markDirty();
});
document.addEventListener('input', function(e){
  var lp = e.target.dataset ? e.target.dataset.list : null;
  if (!lp) return;
  var list = lp === 'config.marquee' ? C.config.marquee : C.config.rail;
  list[+e.target.dataset.i] = e.target.value;
  markDirty();
});
document.addEventListener('change', function(e){
  if (e.target.dataset && e.target.dataset.cast === 'bool' && e.target.dataset.path){
    setPath(C, e.target.dataset.path, e.target.checked);
    markDirty();
  }
  if (e.target.dataset && e.target.dataset.upload != null && e.target.files && e.target.files[0]){
    var input = e.target;
    var lp = input.dataset.list;
    uploadImage(input.files[0], function(url){
      if (lp){
        var list = lp === 'config.marquee' ? C.config.marquee : C.config.rail;
        list.push(url);
        markDirty(); renderMain();
      } else {
        var holder = input.closest('.imgpick');
        if (holder){
          var ipt = holder.querySelector('[data-path]');
          ipt.value = url;
          ipt.dispatchEvent(new Event('input', {bubbles:true}));
          var pv = holder.querySelector('.prev');
          pv.innerHTML = '<img src="' + esc(url) + '" alt="" referrerpolicy="no-referrer">';
        }
      }
    });
    input.value = '';
  }
});
document.addEventListener('keydown', function(e){
  if ((e.metaKey || e.ctrlKey) && e.key === 's'){ e.preventDefault(); if (dirty) save(); }
});
window.addEventListener('beforeunload', function(e){
  if (dirty){ e.preventDefault(); e.returnValue = t('unsaved'); return e.returnValue }
});

/* ---------- save ---------- */
function preSave(){
  try{
    var p = String(C.config.phone || '').replace(/\D/g, '');
    if (/^0\d{9}$/.test(p)){
      var intl = '+966' + p.slice(1);
      if (!C.config.phoneIntl || /^\+966\d{9}$/.test(String(C.config.phoneIntl).replace(/\s/g, ''))) C.config.phoneIntl = intl;
    }
  }catch(e){}
}
function save(){
  $('#saveBtn').textContent = t('saving');
  preSave();
  fetch('api/content', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(C)
  }).then(function(r){
    return r.json().then(function(j){ return {ok: r.ok, j: j} });
  }).then(function(res){
    if (res.ok){
      updated_at = res.j.updated_at;
      clearDirty();
      toast(t('saved'));
    } else if (res.j && res.j.error === 'auth'){
      toast(t('sessionEnded'), true);
      showLogin();
    } else {
      toast(res.j.error || 'error', true);
    }
  }).catch(function(){ toast('network error', true) })
  .finally(function(){ $('#saveBtn').textContent = t('save') });
}
$('#saveBtn').addEventListener('click', save);

document.addEventListener('toggle', function(e){
  var d = e.target;
  if (d && d.classList && d.classList.contains('sgroup') && d.dataset.sg != null) sgOpen[+d.dataset.sg] = d.open;
}, true);

/* ---------- admin language ---------- */
function setLang(l){
  AUL = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.title = t('loginTitle');
  document.body.classList.toggle('show-en', l === 'en');
  var eb = $('#enBtn');
  eb.textContent = l === 'ar' ? 'EN' : 'عربي';
  eb.classList.toggle('en-on', l === 'en');
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.dataset.t) });
  $('#loginPw').placeholder = l === 'ar' ? 'كلمة المرور' : 'Password';
  try{ localStorage.setItem('sjAdminLang', l) }catch(e){}
  renderSide();
  if (!$('#app').classList.contains('hidden')) renderMain();
}

$('#enBtn').addEventListener('click', function(){
  setLang(AUL === 'ar' ? 'en' : 'ar');
});

/* ---------- login & boot ---------- */
function showLogin(){
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#loginPw').value = '';
  $('#loginPw').focus();
}
function showApp(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderSide(); renderMain();
  clearDirty();
}
function loadContent(){
  return fetch('api/content').then(function(r){ return r.json() }).then(function(cc){
    updated_at = cc.updated_at;
    C = cc.content ? deepMerge(clone(DEFAULTS), cc.content) : clone(DEFAULTS);
    if (C._comment) delete C._comment;
    showApp();
  });
}
$('#loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var err = $('#loginErr');
  err.textContent = '';
  fetch('api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:$('#loginPw').value})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j} }) })
    .then(function(res){
      if (res.ok) loadContent();
      else if (res.j.retry_after) err.textContent = t('locked') + Math.ceil(res.j.retry_after/1000) + t('sec');
      else err.textContent = t('loginFail');
    })
    .catch(function(){ err.textContent = 'network error' });
});

fetch('content.json').then(function(r){ return r.json() }).then(function(d){
  DEFAULTS = d;
  var savedLang = null;
  try{ savedLang = localStorage.getItem('sjAdminLang') }catch(e){}
  if (savedLang === 'en') setLang('en');
  fetch('api/session').then(function(r){
    if (r.ok) loadContent();
    else showLogin();
  }).catch(showLogin);
}).catch(function(){
  $('#login').classList.remove('hidden');
  $('#loginErr').textContent = 'failed to load defaults';
});
</script>
